AWSTemplateFormatVersion: 2010-09-09
Description: Create S3 bucket with parameters

Resources:
  UdaBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html

Outputs:
  ArtifactBucketName:
    Description: Name of the S3 bucket
    Value: !Ref ArtifactBucket
    Export:
      Name: ArtifactBucketName
  ArtifactBucketWebsiteURL:
    Description: URL of the S3 bucket website
    Value: !GetAtt UdaBucket.WebsiteURL
  S3BucketSecureURL:
    Value: !GetATT UdaBucket.DomainName
    Description: Name of S2 bucket to hold website